name: Pylint


on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:
  pylint:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
