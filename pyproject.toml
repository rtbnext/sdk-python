[build-system]
requires = [ "hatchling >= 1.27" ]
build-backend = "hatchling.build"

[project]
name = "rtbnext"
version = "1.0.0"
description = "Official Python SDK for the RTBNext API."
readme = "README.md"
license = "MIT"
requires-python = ">= 3.10"

authors = [ {
  name = "Paul Köhler (komed3)",
  email = "webmaster@komed3.de"
} ]

keywords = [
  "rtbnext",
  "billionaires",
  "api",
  "sdk"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed"
]

dependencies = [
  "httpx >= 0.28"
]

[project.urls]
Homepage = "https://rtbnext.de"
Documentation = "https://sdk.rtbnext.de"
Repository = "https://github.com/rtbnext/sdk-python"
"Bug Tracker" = "https://github.com/rtbnext/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = [ "src/rtbnext" ]
