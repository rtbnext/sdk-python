[build-system]
requires = [ "hatchling >= 1.27" ]
build-backend = "hatchling.build"

[project]
name = "rtbnext"
version = "1.0.0"
description = "Official Python SDK for the RTBNext API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

authors = [
  { name = "Paul Köhler (komed3)", email = "webmaster@komed3.de" }
]

keywords = [
  "rtbnext",
  "billionaires",
  "api",
  "sdk"
]
